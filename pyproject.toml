[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-topologies"
version = "0.1.0"
description = "Topology-configurable multi-agent system for scientific tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai]==0.7.5",
    "pydantic>=2.0",
    "PyPDF2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mas_topologies"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
